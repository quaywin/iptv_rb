name: Update Static VOD & Series Catalogs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static TMDB catalogs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bun run build:catalog

      - name: Commit and push updated catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog/vod.json public/catalog/series.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalog): update static VOD & Series catalogs"
            git push
          else
            echo "No catalog changes detected."
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=iptv
